# Este archivo se aplica SOLO cuando un test usa @ActiveProfiles("test").
# Se carga encima de application.properties: lo que se repite acá pisa el valor original.
# Resultado: los tests de integración usan una base H2 en memoria y NO tocan tu PostgreSQL.

# --- Base de datos en memoria (desaparece al terminar los tests) ---
spring.datasource.url=jdbc:h2:mem:gimnasio_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Hibernate ---
# El application.properties principal usa el dialecto de PostgreSQL; acá lo cambiamos.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# create-drop: crea las tablas al arrancar y las borra al terminar.
spring.jpa.hibernate.ddl-auto=create-drop
# Menos ruido en la consola (poné true si querés ver las consultas SQL).
spring.jpa.show-sql=false

# Por si alguien tiene la variable de entorno CARGAR_DATOS_DUMMY=true:
# los tests tienen que partir de una base vacía.
cargar.datos.dummy=false
