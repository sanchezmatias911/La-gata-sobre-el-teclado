spring.application.name=gimnasio
# Configuración de PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/gimnasio
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

cargar.datos.dummy=${CARGAR_DATOS_DUMMY:false}

jwt.secret=${JWT_SECRET:dev-secret-solo-para-desarrollo-cambiar-en-produccion-123456}
jwt.expiracion-minutos=120
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}
admin.dni=${ADMIN_DNI:}